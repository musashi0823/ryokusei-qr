<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>緑城祭QR受付</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:sans-serif;
  text-align:center;
  padding:20px;
}

#reader{
  width:320px;
  margin:auto;
}

#result{
  margin-top:20px;
  font-size:20px;
}
</style>

</head>

<body>

<h2>緑城祭QR受付</h2>

<div id="reader"></div>

<div id="result">
カメラ起動中...
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwirUilo5wPWvvXFLG5Ai_wX4NDKNCr5GLJPFqW8ch9QPxqODBNcUoAeJHhwsh5e3RS/exec";

window.onload = function(){

  const scanner =
    new Html5Qrcode("reader");

  scanner.start(
    { facingMode:"environment" },
    {
      fps:10,
      qrbox:250
    },
    async function(decodedText){

      scanner.stop();

      document.getElementById("result").innerHTML =
        "検索中...";

      const response =
        await fetch(
          API_URL +
          "?ticketId=" +
          encodeURIComponent(decodedText)
        );

      const data =
        await response.json();

      if(!data.found){

        document.getElementById("result").innerHTML =
          "チケットが見つかりません";

        return;

      }

      let html =
        "<h2>" +
        data.visitorName +
        "</h2>" +

        "<p>区分：" +
        data.category +
        "</p>";

     if(data.checkedIn){

  html +=
    "<h3 style='color:red'>⚠ 既に入場済です</h3>";

} else {

  html +=
    "<h3 style='color:green'>✅ 未入場</h3>";

  html +=
    "<button onclick=\"checkIn('" +
    data.ticketId +
    "')\">入場処理</button>";

}

      document.getElementById("result").innerHTML =
        html;

    }
  );

};

</script>

</body>
</html>
